name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Check binary
        run: |
          file dist/MacroForMac.app/Contents/MacOS/MacroForMac
          plutil -lint dist/MacroForMac.app/Contents/Info.plist

      - name: Launch smoke test
        run: |
          open dist/MacroForMac.app
          sleep 10
          if ! pgrep -x MacroForMac > /dev/null; then
            echo "MacroForMac is not running after launch"
            log show --last 2m --predicate 'process == "MacroForMac"' --style compact | tail -50 || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i macro && cat ~/Library/Logs/DiagnosticReports/MacroForMac* | head -80
            exit 1
          fi
          LIB="$HOME/Library/Application Support/MacroForMac/macros.json"
          test -f "$LIB"
          head -c 600 "$LIB"; echo
          mkdir -p screenshots
          screencapture -x screenshots/main-window.png || true
          pkill -x MacroForMac || true
          if [ -f screenshots/main-window.png ]; then
            sips -s format jpeg -s formatOptions 55 -Z 1100 screenshots/main-window.png --out screenshots/preview.jpg > /dev/null
            echo "SCREENSHOT_BASE64_BEGIN"
            base64 -b 200 -i screenshots/preview.jpg
            echo "SCREENSHOT_BASE64_END"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacroForMac.app dist/MacroForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacroForMac
          path: dist/MacroForMac.zip
          if-no-files-found: error
