name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Check binary
        run: |
          file dist/MacroForMac.app/Contents/MacOS/MacroForMac
          plutil -lint dist/MacroForMac.app/Contents/Info.plist

      - name: Launch smoke test
        run: |
          open dist/MacroForMac.app
          sleep 10
          if ! pgrep -x MacroForMac > /dev/null; then
            echo "MacroForMac is not running after launch"
            log show --last 2m --predicate 'process == "MacroForMac"' --style compact | tail -50 || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i macro && cat ~/Library/Logs/DiagnosticReports/MacroForMac* | head -80
            exit 1
          fi
          LIB="$HOME/Library/Application Support/MacroForMac/macros.json"
          test -f "$LIB"
          head -c 300 "$LIB"; echo
          # Check the macro list and editor were built (via the accessibility tree).
          perl -e 'alarm 40; exec @ARGV' osascript -e 'tell application "System Events" to tell process "MacroForMac" to get entire contents of window 1' \
            | tr ',' '\n' | grep -E '^ ?static text' | sed -E 's/ of (UI element|group|window).*//' | head -40 || echo "(UI tree unavailable)"
          mkdir -p screenshots
          screencapture -x screenshots/main-window.png || true
          pkill -x MacroForMac || true
          # The in-app "Fix Permission" button runs these; make sure they work without admin rights.
          for service in Accessibility PostEvent ListenEvent; do
            /usr/bin/tccutil reset "$service" com.macroformac.MacroForMac
          done

      - name: UI probes (temporary)
        run: |
          APP=dist/MacroForMac.app
          BIN=$APP/Contents/MacOS/MacroForMac
          mkdir -p screenshots
          shoot() {
            local name=$1
            sleep 8
            local pid
            pid=$(pgrep -x MacroForMac | head -1)
            echo "INFO_${name}: pid=$pid cpu=$(ps -o %cpu= -p "$pid" 2>/dev/null) trusted-banner=$(perl -e 'alarm 20; exec @ARGV' osascript -e 'tell application "System Events" to tell process "MacroForMac" to get value of static texts of group 2 of splitter group 1 of group 1 of window 1' 2>/dev/null | grep -c Accessibility)"
            if [ "$name" = open0 ]; then
              sample "$pid" 2 -mayDie > screenshots/sample.txt 2>/dev/null || true
              echo "SAMPLE_BEGIN"
              grep -A 40 "Thread_.*DispatchQueue_1: com.apple.main-thread" screenshots/sample.txt | head -45 || true
              echo "SAMPLE_END"
            fi
            screencapture -x "screenshots/$name.png" || true
            pkill -x MacroForMac || true
            sleep 2
            sips -s format jpeg -s formatOptions 40 -Z 760 "screenshots/$name.png" --out "screenshots/$name.jpg" > /dev/null
            echo "PROBE_${name}_BEGIN"
            base64 -b 200 -i "screenshots/$name.jpg"
            echo "PROBE_${name}_END"
          }
          # Launched like a user would (Finder / LaunchServices).
          for v in 0 2 3 5; do
            defaults write com.macroformac.MacroForMac MacroForMacUIProbe -int $v
            open "$APP"
            shoot "open$v"
          done
          # Launched directly from the executable (inherits the runner's permissions).
          defaults write com.macroformac.MacroForMac MacroForMacUIProbe -int 0
          "$BIN" > /dev/null 2>&1 &
          shoot direct0
          defaults delete com.macroformac.MacroForMac MacroForMacUIProbe || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacroForMac.app dist/MacroForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacroForMac
          path: dist/MacroForMac.zip
          if-no-files-found: error
