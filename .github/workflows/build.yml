name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Check binary
        run: |
          file dist/MacroForMac.app/Contents/MacOS/MacroForMac
          plutil -lint dist/MacroForMac.app/Contents/Info.plist

      - name: Launch smoke test
        run: |
          open dist/MacroForMac.app
          sleep 10
          if ! pgrep -x MacroForMac > /dev/null; then
            echo "MacroForMac is not running after launch"
            log show --last 2m --predicate 'process == "MacroForMac"' --style compact | tail -50 || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i macro && cat ~/Library/Logs/DiagnosticReports/MacroForMac* | head -80
            exit 1
          fi
          LIB="$HOME/Library/Application Support/MacroForMac/macros.json"
          test -f "$LIB"
          head -c 300 "$LIB"; echo
          # Check the macro list and editor were built (via the accessibility tree).
          perl -e 'alarm 40; exec @ARGV' osascript -e 'tell application "System Events" to tell process "MacroForMac" to get entire contents of window 1' \
            | tr ',' '\n' | grep -E '^ ?static text' | sed -E 's/ of (UI element|group|window).*//' | head -40 || echo "(UI tree unavailable)"
          mkdir -p screenshots
          screencapture -x screenshots/main-window.png || true
          pkill -x MacroForMac || true
          # The in-app "Fix Permission" button runs these; make sure they work without admin rights.
          for service in Accessibility PostEvent ListenEvent; do
            /usr/bin/tccutil reset "$service" com.macroformac.MacroForMac
          done

      - name: UI click test
        run: |
          # Opened like a user would, without Accessibility permission (so the permission
          # banner is showing). Clicks real screen positions: a macro in the sidebar, then the
          # "Loop until stopped" checkbox, and checks that the change was saved.
          open dist/MacroForMac.app
          sleep 8
          perl -e 'alarm 120; exec @ARGV' osascript <<'OSA'
          on findElement(theRole, theText)
          	tell application "System Events" to tell process "MacroForMac"
          		repeat with e in (entire contents of window 1)
          			set matched to false
          			try
          				if value of e is theText then set matched to true
          			end try
          			try
          				if name of e is theText then set matched to true
          			end try
          			try
          				if matched and role of e is theRole then return contents of e
          			end try
          		end repeat
          	end tell
          	error "Not found: " & theText
          end findElement
          on clickCenter(e)
          	tell application "System Events"
          		set p to position of e
          		set s to size of e
          	end tell
          	set x to round ((item 1 of p) + (item 1 of s) / 2)
          	set y to round ((item 2 of p) + (item 2 of s) / 2)
          	tell application "System Events" to tell process "MacroForMac" to click at {x, y}
          end clickCenter
          tell application "System Events" to tell process "MacroForMac" to set frontmost to true
          delay 0.5
          clickCenter(findElement("AXStaticText", "Example: Select All & Copy"))
          delay 1.5
          clickCenter(findElement("AXCheckBox", "Loop until stopped"))
          delay 1.5
          OSA
          mkdir -p screenshots
          screencapture -x screenshots/after-clicks.png || true
          pkill -x MacroForMac || true
          sleep 1
          python3 - "$HOME/Library/Application Support/MacroForMac/macros.json" <<'PY'
          import json, sys
          macros = json.load(open(sys.argv[1]))["macros"]
          macro = next(m for m in macros if m["name"] == "Example: Select All & Copy")
          print("Select All & Copy repeatCount:", macro["repeatCount"])
          sys.exit(0 if macro["repeatCount"] == 0 else "Clicking the sidebar / Loop checkbox did not work")
          PY
          sips -s format jpeg -s formatOptions 40 -Z 760 screenshots/after-clicks.png --out screenshots/after-clicks.jpg > /dev/null
          echo "PROBE_after_BEGIN"
          base64 -b 200 -i screenshots/after-clicks.jpg
          echo "PROBE_after_END"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacroForMac.app dist/MacroForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacroForMac
          path: dist/MacroForMac.zip
          if-no-files-found: error
