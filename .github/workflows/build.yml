name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" ./scripts/build-app.sh

      - name: Check binary
        run: |
          file dist/MacroForMac.app/Contents/MacOS/MacroForMac
          plutil -lint dist/MacroForMac.app/Contents/Info.plist

      - name: Launch smoke test
        run: |
          open dist/MacroForMac.app
          sleep 10
          if ! pgrep -x MacroForMac > /dev/null; then
            echo "MacroForMac is not running after launch"
            log show --last 2m --predicate 'process == "MacroForMac"' --style compact | tail -50 || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i macro && cat ~/Library/Logs/DiagnosticReports/MacroForMac* | head -80
            exit 1
          fi
          LIB="$HOME/Library/Application Support/MacroForMac/macros.json"
          test -f "$LIB"
          head -c 300 "$LIB"; echo
          # Check the macro list and editor were built (via the accessibility tree).
          perl -e 'alarm 40; exec @ARGV' osascript -e 'tell application "System Events" to tell process "MacroForMac" to get entire contents of window 1' \
            | tr ',' '\n' | grep -E '^ ?static text' | sed -E 's/ of (UI element|group|window).*//' | head -40 || echo "(UI tree unavailable)"
          mkdir -p screenshots
          screencapture -x screenshots/main-window.png || true
          pkill -x MacroForMac || true
          # The in-app "Fix Permission" button runs these; make sure they work without admin rights.
          for service in Accessibility PostEvent ListenEvent; do
            /usr/bin/tccutil reset "$service" com.macroformac.MacroForMac
          done

      - name: UI probes (temporary)
        run: |
          BIN=dist/MacroForMac.app/Contents/MacOS/MacroForMac
          mkdir -p screenshots
          for v in 0 1 2 3 4; do
            MACROFORMAC_UI_PROBE=$v "$BIN" > "screenshots/stderr-$v.txt" 2>&1 &
            PID=$!
            sleep 7
            if [ "$v" = 0 ]; then
              echo "AX_FRAMES_BEGIN"
              perl -e 'alarm 30; exec @ARGV' osascript \
                -e "set AppleScript's text item delimiters to \",\"" \
                -e 'tell application "System Events" to tell process "MacroForMac"' \
                -e 'set out to "window: " & ((position of window 1) as text) & " / " & ((size of window 1) as text) & linefeed' \
                -e 'repeat with e in (UI elements of splitter group 1 of group 1 of window 1)' \
                -e 'set out to out & (role of e) & ": " & ((position of e) as text) & " / " & ((size of e) as text) & linefeed' \
                -e 'end repeat' \
                -e 'try' \
                -e 'set r to row 1 of outline 1 of scroll area 1 of group 1 of splitter group 1 of group 1 of window 1' \
                -e 'set out to out & "sidebar row 1: " & ((position of r) as text) & " / " & ((size of r) as text) & linefeed' \
                -e 'end try' \
                -e 'return out' \
                -e 'end tell' || echo "(AX query failed)"
              echo "AX_FRAMES_END"
            fi
            screencapture -x "screenshots/probe-$v.png" || true
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
            sips -s format jpeg -s formatOptions 40 -Z 760 "screenshots/probe-$v.png" --out "screenshots/probe-$v.jpg" > /dev/null
            echo "PROBE_${v}_BEGIN"
            base64 -b 200 -i "screenshots/probe-$v.jpg"
            echo "PROBE_${v}_END"
            echo "STDERR_${v}_BEGIN"
            grep -v -E '^\s*$' "screenshots/stderr-$v.txt" | head -40 || true
            echo "STDERR_${v}_END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacroForMac.app dist/MacroForMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacroForMac
          path: dist/MacroForMac.zip
          if-no-files-found: error
